name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Run Ruff linting
        run: uv run ruff check .

  format:
    name: Code Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --dev

      - name: Check code formatting
        run: uv run ruff format --check .

  dbt_ci:
    name: dbt CI - SQL Linting and Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UV
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Cache uv dependencies
        uses: actions/cache@v4
        with:
          path: |
            .venv
            .uv
          key: ${{ runner.os }}-uv-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install CI dependencies
        run: uv sync --group pr_ci --no-dev

      - name: Create .dbt directory
        run: mkdir -p .dbt

      - name: Write Snowflake private key
        run: |
          mkdir -p .secrets
          echo "${{ secrets.SNOWFLAKE_PRIVATE_KEY_CONTENT }}" > .secrets/rsa_key.p8
          chmod 600 .secrets/rsa_key.p8
        shell: bash

      - name: Run dbt debug
        run: uv run dbt debug -t ci --project-dir dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PATH: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_FILE_PWD }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
          DBT_PROFILES_DIR: ${{ vars.DBT_PROFILES_DIR }}
          DBT_PROJECT_DIR: ${{ vars.DBT_PROJECT_DIR }}
          DBT_TARGET: ci

      - name: Run SQLFluff lint
        run: uv run sqlfluff lint --dialect snowflake --templater dbt dbt/models/
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PATH: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_FILE_PWD }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
          DBT_PROFILES_DIR: ${{ vars.DBT_PROFILES_DIR }}
          DBT_PROJECT_DIR: ${{ vars.DBT_PROJECT_DIR }}
          DBT_TARGET: ci

      - name: Run dbt deps
        run: uv run dbt deps -t ci --project-dir dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PATH: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_FILE_PWD }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
          DBT_PROFILES_DIR: ${{ vars.DBT_PROFILES_DIR }}
          DBT_PROJECT_DIR: ${{ vars.DBT_PROJECT_DIR }}
          DBT_TARGET: ci

      - name: Run dbt tests
        run: uv run dbt test -t ci --project-dir dbt
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_FILE: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PATH: .secrets/rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_FILE_PWD: ${{ secrets.SNOWFLAKE_PRIVATE_KEY_FILE_PWD }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
          DBT_PROFILES_DIR: ${{ vars.DBT_PROFILES_DIR }}
          DBT_PROJECT_DIR: ${{ vars.DBT_PROJECT_DIR }}
          DBT_TARGET: ci