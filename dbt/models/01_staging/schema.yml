# Data quality tests for ticket sales models
# File: models/02_staging/schema.yml

version: 2

models:
  - name: stg_ticket_sales
    description: "Cleaned and standardized ticket sales data from streaming source"
    columns:
      - name: ticket_sales_key
        description: "Unique identifier for each ticket sales event"
        tests:
          - unique
          - not_null
      
      - name: show_id
        description: "Unique identifier for the show"
        tests:
          - not_null
      
      - name: artist_name
        description: "Name of the performing artist"
        tests:
          - not_null
      
      - name: venue_name
        description: "Name of the venue"
        tests:
          - not_null
      
      - name: tickets_sold
        description: "Number of tickets sold in this event"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              inclusive: true
      
      - name: revenue
        description: "Revenue generated from this ticket sale event"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: venue_capacity
        description: "Total capacity of the venue"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      
      - name: sales_rate
        description: "Percentage of venue capacity sold"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              inclusive: true
      
      - name: days_until_show
        description: "Number of days until the show date"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: average_ticket_price
        description: "Average price per ticket"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: venue_utilization_pct
        description: "Percentage of venue capacity utilized"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              inclusive: true
      
      - name: sales_velocity_per_day
        description: "Tickets sold per day until show"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
