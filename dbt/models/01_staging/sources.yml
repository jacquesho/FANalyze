version: 2

sources:
  - name: FAN_RAW
    database: "{{ target.database }}"
    schema: "{{ 'FAN_CI_RAW' if target.name == 'ci' else 'FAN_RAW' }}"
    description: "Raw data sources for events and ticket sales"
    tables:
      - name: shows_his
        columns:
          - name: artist_id
            description: "Unique identifier for the artist"
            tests:
              - not_null
          - name: artist_name
            description: "Name of the artist"
            tests: []
          - name: show_date
            description: "Date of the show"
            tests:
              - not_null
          - name: venue_name
            description: "Name of the venue"
            tests:
              - not_null
          - name: venue_id
            description: "Unique identifier for the venue"
            tests:
              - not_null
      - name: shows_future
        description: "Upcoming concerts data"
        columns:
          - name: artist_name
            description: "Name of the artist"
            tests:
              - not_null
          - name: show_date
            description: "Date of the upcoming show"
            tests:
              - not_null
          - name: venue_name
            description: "Name of the venue"
            tests:
              - not_null
          - name: city_name
            description: "City where the show will take place"
            tests:
              - not_null
          - name: state_code
            description: "State code where the show will take place"
            tests: []
          # country_name omitted (US-only)
          - name: show_id
            description: "Unique identifier for the show"
            tests:
              - not_null
              - unique
          - name: venue_id
            description: "Unique identifier for the venue"
            tests:
              - not_null

  - name: ticket_sales
    description: "Raw ticket sales data from streaming pipeline"
    database: "{{ target.database }}"
    schema: fan_raw
    tables:
      - name: raw_tickets
        description: "Raw ticket sales events from PostgreSQL streaming"
        columns:
          - name: id
            description: "Primary key from PostgreSQL"
            tests:
              - not_null
          - name: timestamp
            description: "Timestamp of the ticket sale event"
            tests:
              - not_null
          - name: show_id
            description: "Unique identifier for the show"
            tests:
              - not_null
          - name: artist_name
            description: "Name of the performing artist"
            tests:
              - not_null
          - name: venue_name
            description: "Name of the venue"
            tests:
              - not_null
          - name: show_date
            description: "Date of the show"
            tests:
              - not_null
          - name: tickets_sold
            description: "Number of tickets sold in this event"
            tests:
              - not_null
          - name: revenue
            description: "Revenue from this ticket sale event"
            tests:
              - not_null
          - name: venue_capacity
            description: "Total capacity of the venue"
            tests:
              - not_null
          - name: sales_rate
            description: "Percentage of venue capacity sold"
            tests:
              - not_null
          - name: days_until_show
            description: "Number of days until the show"
            tests:
              - not_null
          - name: artist_tier
            description: "Tier classification of the artist"
            tests:
              - not_null
          - name: average_ticket_price
            description: "Average price per ticket"
            tests:
              - not_null
          - name: city_name
            description: "City where the show took place"
            tests:
              - not_null
          - name: state_code
            description: "State code where the show took place"
            tests: []
          # country_name omitted (US-only)
          - name: tickets_sold
            description: "Number of tickets sold"
            tests: []
          - name: sellout_status
            description: "Whether the show sold out"
            tests: []
          - name: attendance_rate
            description: "Percentage of venue capacity filled"
            tests: []
          - name: average_ticket_price
            description: "Average price per ticket"
            tests: []
          - name: revenue
            description: "Total revenue from ticket sales"
            tests: []

