# Data quality tests for marts layer models
# File: models/03_marts/schema.yml

version: 2

models:
  - name: fact_ticket_sales
    description: "Core fact table for ticket sales events with incremental loading"
    columns:
      - name: ticket_sales_key
        description: "Unique identifier for each ticket sales event"
        tests:
          - unique
          - not_null
      
      - name: show_id
        description: "Unique identifier for the show"
        tests:
          - not_null
      
      - name: artist_name
        description: "Name of the performing artist"
        tests:
          - not_null
      
      - name: tickets_sold
        description: "Number of tickets sold in this event"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
              inclusive: true
      
      - name: revenue
        description: "Revenue generated from this ticket sale event"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: demand_category
        description: "Categorized demand level based on sales rate"
        tests:
          - accepted_values:
              values: ['High Demand', 'Medium Demand', 'Low Demand', 'Very Low Demand']
      
      - name: time_to_show_category
        description: "Categorized time until show"
        tests:
          - accepted_values:
              values: ['Last Week', 'Last Month', 'Last Quarter', 'Future']
      
      - name: revenue_per_ticket
        description: "Revenue per ticket sold"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
  
  - name: dim_artists_tickets
    description: "Artist dimension table for ticket sales - built from ticket sales aggregations"
    columns:
      - name: artist_name
        description: "Artist name (natural key, FK from fact_ticket_sales)"
        tests:
          - unique
          - not_null
      - name: artist_tier
        description: "Artist tier classification"
        tests:
          - not_null
      - name: total_shows_with_sales
        description: "Number of shows with ticket sales for this artist"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: total_revenue
        description: "Total revenue from ticket sales for this artist"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: dim_venues_tickets
    description: "Venue dimension table for ticket sales - built from ticket sales aggregations"
    columns:
      - name: venue_name
        description: "Venue name (natural key, FK from fact_ticket_sales)"
        tests:
          - not_null
      - name: city_name
        description: "City where venue is located"
        tests:
          - not_null
      - name: venue_capacity
        description: "Venue capacity"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true
      - name: total_shows
        description: "Number of shows at this venue"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true

  - name: dim_shows_tickets
    description: "Show dimension table for ticket sales - show-level attributes and final metrics"
    columns:
      - name: show_id
        description: "Show identifier (natural key, FK from fact_ticket_sales)"
        tests:
          - unique
          - not_null
      - name: artist_name
        description: "Artist name"
        tests:
          - not_null
      - name: venue_name
        description: "Venue name"
        tests:
          - not_null
      - name: show_date
        description: "Date of the show"
        tests:
          - not_null
      - name: final_tickets_sold
        description: "Final number of tickets sold for this show"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      - name: final_sales_rate
        description: "Final sales rate percentage"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 100
              inclusive: true
      - name: performance_rating
        description: "Overall performance rating for the show"
        tests:
          - accepted_values:
              values: ['Excellent', 'Good', 'Average', 'Below Average', 'Poor']

  - name: marts_ticket_performance
    description: "Dimension table with aggregated performance metrics per show"
    columns:
      - name: show_id
        description: "Unique identifier for the show"
        tests:
          - unique
          - not_null
      
      - name: artist_name
        description: "Name of the performing artist"
        tests:
          - not_null
      
      - name: venue_name
        description: "Name of the venue"
        tests:
          - not_null
      
      - name: total_tickets_sold
        description: "Total tickets sold for this show"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: final_revenue
        description: "Final revenue for this show"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: performance_rating
        description: "Overall performance rating for the show"
        tests:
          - accepted_values:
              values: ['Excellent', 'Good', 'Average', 'Below Average', 'Poor']
      
      - name: capacity_category
        description: "Venue capacity utilization category"
        tests:
          - accepted_values:
              values: ['Sold Out', 'Near Capacity', 'Half Full', 'Quarter Full', 'Low Attendance']
  
  - name: marts_daily_ticket_summary
    description: "Daily aggregated ticket sales summaries"
    columns:
      - name: sale_date
        description: "Date of ticket sales"
        tests:
          - not_null
      
      - name: artist_name
        description: "Name of the performing artist"
        tests:
          - not_null
      
      - name: daily_tickets_sold
        description: "Total tickets sold on this date"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      
      - name: daily_revenue
        description: "Total revenue generated on this date"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: true
      
      - name: daily_performance_rating
        description: "Overall daily performance rating"
        tests:
          - accepted_values:
              values: ['Excellent Day', 'Good Day', 'Average Day', 'Below Average Day', 'Poor Day']
      
      - name: daily_revenue_tier
        description: "Daily revenue tier classification"
        tests:
          - accepted_values:
              values: ['High Revenue', 'Medium Revenue', 'Low Revenue', 'Very Low Revenue']
