# Source definitions for ticket sales data
# File: models/sources.yml

version: 2

sources:
  - name: ticket_sales
    description: "Raw ticket sales data from streaming pipeline"
    database: fanalyze_dev
    schema: fan_raw
    tables:
      - name: raw_tickets
        description: "Raw ticket sales events from PostgreSQL streaming"
        columns:
          - name: id
            description: "Primary key from PostgreSQL"
            tests:
              - not_null
          - name: timestamp
            description: "Timestamp of the ticket sale event"
            tests:
              - not_null
          - name: show_id
            description: "Unique identifier for the show"
            tests:
              - not_null
          - name: artist_name
            description: "Name of the performing artist"
            tests:
              - not_null
          - name: venue_name
            description: "Name of the venue"
            tests:
              - not_null
          - name: show_date
            description: "Date of the show"
            tests:
              - not_null
          - name: tickets_sold
            description: "Number of tickets sold in this event"
            tests:
              - not_null
          - name: revenue
            description: "Revenue from this ticket sale event"
            tests:
              - not_null
          - name: venue_capacity
            description: "Total capacity of the venue"
            tests:
              - not_null
          - name: sales_rate
            description: "Percentage of venue capacity sold"
            tests:
              - not_null
          - name: days_until_show
            description: "Number of days until the show"
            tests:
              - not_null
          - name: artist_tier
            description: "Tier classification of the artist"
            tests:
              - not_null
          - name: average_ticket_price
            description: "Average price per ticket"
            tests:
              - not_null
