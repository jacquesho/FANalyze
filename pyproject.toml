[project]
name = "FANalyze_2.0"
version = "2.0.0"
description = "FANalyze 2.0: end-to-end data engineering and AI analytics platform"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.1",
    "psycopg[binary]~=3.2",
    "rich>=14.1.0",
    "snowflake-connector-python>=3.10.1",
    "pandas>=2.0.0",
    "dbt-core>=1.10.13",
    "dbt-snowflake>=1.10.2",
    "faker>=30.0.0",
    "cryptography>=45.0.7",
    "psycopg2-binary>=2.9.11",
    "dbterd>=1.21.0",
    "confluent-kafka>=2.3.0",
    "pdfplumber>=0.11.0",
    "tiktoken>=0.8.0",
    "langchain-text-splitters>=0.3.0",
    "pinecone>=7.3.0",
    "streamlit>=1.52.2",
    "langchain-core>=1.2.5",
    "langchain-openai>=1.1.6",
    "langgraph>=1.0.5",
    "langgraph-checkpoint-postgres>=3.0.2",
]

[dependency-groups]
pr_ci = [
    "dbt-snowflake>=1.10.2",
    "sqlfluff>=3.4.2",
    "sqlfluff-templater-dbt>=3.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "sqlfluff>=3.4.2",
    "sqlfluff-templater-dbt>=3.4.2",
]
airflow = [
    "apache-airflow-providers-postgres>=5.10.0",
    "apache-airflow-providers-snowflake>=5.0.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# This project doesn't have installable Python packages, only dependencies
# Set packages to empty to prevent setuptools from auto-discovering directories
packages = []
py-modules = []

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
ignore = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
